# Blueprint Render — giống Novel (free tier).
# Docs: DEPLOYMENT.md
#
# Giới hạn free: Postgres hết hạn sau 30 ngày; web sleep ~15 phút không traffic;
# không có MinIO bền / Celery worker riêng (ingestion chạy inline khi Celery lỗi).

databases:
  - name: kl-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: kl-redis
    plan: free
    ipAllowList: [] # chỉ nội bộ Render

  - type: web
    name: kl-embedding
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/embedding-service/Dockerfile
    dockerContext: ./apps/embedding-service
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: EMBEDDING_DIMENSION
        value: "1024"

  - type: web
    name: kl-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile.prod
    dockerContext: ./apps/api
    dockerCommand: >-
      ./docker-entrypoint.sh uvicorn app.main:app
      --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: RUN_MIGRATIONS
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: EMBEDDING_DIMENSION
        value: "1024"
      - key: EMBEDDING_MODEL
        value: bge-m3
      # Public URLs (trùng tên service trên Render)
      - key: APP_URL
        value: https://kl-web.onrender.com
      - key: API_URL
        value: https://kl-api.onrender.com
      - key: API_PUBLIC_URL
        value: https://kl-api.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://kl-api.onrender.com/api/v1/auth/google/callback
      - key: DATABASE_URL
        fromDatabase:
          name: kl-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kl-redis
          type: keyvalue
          property: connectionString
      - key: EMBEDDING_SERVICE_URL
        value: https://kl-embedding.onrender.com
      # Secrets — Render generate / bạn điền lúc tạo Blueprint
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: CONNECTOR_SIGNING_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SEED_SUPER_ADMIN_EMAIL
        sync: false
      # Object storage: điền sau (R2/S3/MinIO). Upload file sẽ lỗi cho đến khi có.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: knowledge-library
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto

  - type: web
    name: kl-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile.prod
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://kl-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://kl-api.onrender.com
      # Dùng lúc docker build (rewrites Next.js)
      - key: API_INTERNAL_URL
        value: https://kl-api.onrender.com
